# Confirm a payment on CMA CGM's "RTGS Confirmation (CMA CGM) - New Request" page
# (rtgs.india.cma-cgm.com/index.php/Finance/RTGS/NewRequest?shipcomp_code=0001).
# Filed twice per MBL, once for each payment Finance makes:
#   - the shipment payment: row 1 of the invoice grid has the DO invoice number,
#     the B/L and the amount;
#   - the security deposit: row 1 has Security Deposit ticked, the OBL (the master
#     B/L) and the amount, and no invoice number.
# CMA CGM then emails a receipt for each to the Email(s) given.
#
# The selectors are the real page's own, from its HTML (2026-10-14): the field ids,
# the Handsontable invoice grid (#invoice_table, whose cells take a click, typing
# and Enter, one at a time), the privacy policy tick (#accept_tc), Submit
# (#submit_rtgs) and the "Submitted Successfully" page with its request reference.
# The local version (make portals) copies that page, and this SOP is proven
# against it. Pointed at the real site it would confirm a real payment: run it
# there only with a real UTR, and only on purpose.
#
# Params, built by app/portal_params.py (steps cma_rtgs_shipment_payment and
# cma_rtgs_security_deposit):
#   cma_rtgs_url      where the site is: DO_CMA_RTGS_URL, the local one by default
#   company_name      fixed details: Forwarder
#   contact_name      fixed details: Contact name on CMA CGM's RTGS page
#   contact_number    fixed details: Contact number on CMA CGM's RTGS page
#   emails            fixed details: Emails for CMA CGM's invoice and receipts (at most 3)
#   utr               job: UTR for the shipment payment, or UTR for the security deposit
#   bank_account      fixed details: Bank account no. that pays CMA CGM
#   amount            job: DO invoice amount, or Security deposit, as 54720.68
#   transfer_date     job: Date of transfer, as DD-MM-YYYY
#   security_deposit  "yes" for the security deposit, empty for the shipment payment
#   invoice_no        job: DO invoice no.; empty for the security deposit
#   bl_no             job: Master B/L no.
#
# Reads back: cma_rtgs_request_ref (the request reference the page gives)
metadata:
  name: "CMA CGM RTGS - New Request"
  version: "0.3"

steps:
  - action: goto
    description: Open the RTGS Confirmation page for CMA CGM
    method: playwright
    url: "{params.cma_rtgs_url}/index.php/Finance/RTGS/NewRequest?shipcomp_code=0001"
    wait_for: domcontentloaded

  - action: wait_for_selector
    description: Wait for the invoice grid, the last part of the page to be built
    method: playwright
    selector: "#invoice_table .ht_master .htCore tbody tr"

  # The same page serves ANL (Change Carrier). Never confirm CMA CGM's payment
  # under another carrier.
  - action: execute_script
    description: Make sure the page is CMA CGM's
    method: playwright
    script: |
      () => {
        const code = document.querySelector('#shipcomp_code');
        if (!code || code.value !== '0001') {
          throw new Error('This is not the CMA CGM RTGS page: choose CMA CGM under Change Carrier');
        }
      }

  - action: fill
    description: Enter the company name
    method: playwright
    selector: "#company_name"
    value_from: params.company_name

  - action: fill
    description: Enter the contact name
    method: playwright
    selector: "#contact_name"
    value_from: params.contact_name

  - action: fill
    description: Enter the contact number
    method: playwright
    selector: "#contact_number"
    value_from: params.contact_number

  - action: fill
    description: Enter the emails the receipt goes to
    method: playwright
    selector: "#contact_email"
    value_from: params.emails

  - action: fill
    description: Enter the UTR number
    method: playwright
    selector: "#utr_number"
    value_from: params.utr

  - action: fill
    description: Enter the bank account the payment came from
    method: playwright
    selector: "#bank_account_number"
    value_from: params.bank_account

  - action: fill
    description: Enter the date of transfer
    method: playwright
    selector: "#transfer_date"
    value_from: params.transfer_date

  # The field opens a date picker under it, over the top of the invoice grid.
  - action: press
    description: Close the date picker
    method: playwright
    selector: "#transfer_date"
    key: Escape

  - action: execute_script
    description: Choose INR as the currency
    method: playwright
    script: |
      () => {
        const select = document.querySelector('#currency');
        select.value = 'INR';
        if (select.value !== 'INR') throw new Error('The page has no INR currency');
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }

  - action: fill
    description: Enter the amount transferred
    method: playwright
    selector: "#amount_transfered"
    value_from: params.amount

  # Row 1 of the invoice grid. Its columns: Security Deposit, Invoice Number,
  # BL Number, Amount, Remarks. Each cell takes a click, the value, then Enter.
  - action: click
    description: Tick Security Deposit on row 1
    method: playwright
    condition: params.security_deposit
    selector: "#invoice_table .ht_master .htCore tbody tr:nth-child(1) input.htCheckboxRendererInput"

  - action: type
    description: Enter the invoice number on row 1
    method: playwright
    condition: params.invoice_no
    selector: "#invoice_table .ht_master .htCore tbody tr:nth-child(1) > td:nth-of-type(2)"
    value_from: params.invoice_no
    delay: 40

  - action: press
    description: Keep the invoice number
    method: playwright
    condition: params.invoice_no
    key: Enter

  - action: type
    description: Enter the BL number on row 1
    method: playwright
    selector: "#invoice_table .ht_master .htCore tbody tr:nth-child(1) > td:nth-of-type(3)"
    value_from: params.bl_no
    delay: 40

  - action: press
    description: Keep the BL number
    method: playwright
    key: Enter

  - action: type
    description: Enter the amount on row 1
    method: playwright
    selector: "#invoice_table .ht_master .htCore tbody tr:nth-child(1) > td:nth-of-type(4)"
    value_from: params.amount
    delay: 40

  - action: press
    description: Keep the amount
    method: playwright
    key: Enter

  # The grid is the easiest part to get wrong, so it's read back before submitting.
  - action: execute_script
    description: Check row 1 of the invoice grid
    method: playwright
    script_args:
      security_deposit: params.security_deposit
      invoice_no: params.invoice_no
      bl_no: params.bl_no
      amount: params.amount
    script: |
      ({ security_deposit, invoice_no, bl_no, amount }) => {
        const row = document.querySelector('#invoice_table .ht_master .htCore tbody tr:nth-child(1)');
        const cell = (n) => row.querySelector(`td:nth-of-type(${n})`).textContent.trim();
        const ticked = row.querySelector('input.htCheckboxRendererInput').checked;
        const wrong = [];
        if (ticked !== Boolean(security_deposit)) wrong.push(`Security Deposit is ${ticked ? '' : 'not '}ticked`);
        if (cell(2) !== invoice_no) wrong.push(`Invoice Number reads "${cell(2)}"`);
        if (cell(3) !== bl_no) wrong.push(`BL Number reads "${cell(3)}"`);
        if (Number(cell(4).replace(/,/g, '')) !== Number(amount)) wrong.push(`Amount reads "${cell(4)}"`);
        if (wrong.length) throw new Error(`Row 1 of the invoice grid is wrong: ${wrong.join('; ')}`);
      }

  - action: execute_script
    description: Accept the privacy policy
    method: playwright
    script: |
      () => {
        const accept = document.querySelector('#accept_tc');
        if (!accept.checked) accept.click();
      }

  # The submit and the check are separate steps, since the agent retries a failed
  # step and only the check is safe to repeat.
  - action: click
    description: Submit
    method: playwright
    selector: "#submit_rtgs"

  # Either the page that confirms the request, or the page's own error messages:
  # its form checks in span.form-error, a server message in #infoMessage.
  - action: wait_for_selector
    description: Wait for the page's answer
    method: playwright
    selector: "xpath=//*[contains(text(), 'Submitted Successfully')] | //span[contains(@class, 'form-error')] | //*[@id='infoMessage']//*[contains(@class, 'alert')]"

  - action: execute_script
    description: Read the request reference the page gave
    method: playwright
    extract_result: true
    script: |
      () => {
        const errors = [...document.querySelectorAll('span.form-error, #infoMessage .alert')]
          .map((e) => e.textContent.trim()).filter(Boolean);
        if (errors.length) throw new Error(`The RTGS page didn't take the payment: ${errors.join(' ')}`);
        const found = document.body.innerText.match(/Request Reference\s+(\d+)/);
        if (!found) throw new Error('The RTGS page gave no request reference');
        return { cma_rtgs_request_ref: found[1] };
      }

  - action: end
    description: Done
