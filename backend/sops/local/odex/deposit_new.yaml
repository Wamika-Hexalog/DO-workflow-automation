# Register the security deposit on ODeX: Counter Process → Deposit and Refund →
# New Deposit. Runs once per house bill: ODeX takes a deposit per B/L.
#
# Written for the local ODeX (make portals). The real page's selectors aren't known
# yet; sops/local/README.md says what's needed to point it at the real one.
#
# Params, built by app/portal_params.py (step odex_deposit_new):
#   odex_url          where ODeX is: DO_ODEX_URL, the local one by default
#   liner             fixed details: Liner on ODeX
#   hbl_no            the house B/L this deposit is for
#   amount            job: Security deposit
#   utr               job: UTR for the security deposit
#   payment_date      job: Date of transfer, YYYY-MM-DD
#   bank_name         fixed details: Bank that pays CMA CGM
#   refund_to         job: Deposit refunded to ("Third Party" or "Consignee")
#   third_party_name  job: CHA, for a refund to a third party; empty otherwise
#   noc_file          the NOC for the refund (app/letters.py noc_refund), for a refund
#                     to a third party; empty otherwise
#   receipt_file      the Security Receipt in the DO folder
#
# Reads back: odex_deposit_ref
metadata:
  name: "Local ODeX - New Deposit"
  version: "0.1"

credentials:
  username_env: "LOCAL_ODEX_USERNAME"
  password_env: "LOCAL_ODEX_PASSWORD"

steps:
  - action: goto
    description: Open the ODeX login page
    method: playwright
    url: "{params.odex_url}/login"
    wait_for: domcontentloaded

  # The login page's fields have the real ODeX's ids.
  - action: fill
    description: Enter the User ID
    method: playwright
    selector: "#loginId"
    value_from: credentials.username_env

  - action: fill
    description: Enter the password
    method: playwright
    selector: "#password"
    value_from: credentials.password_env

  # ODeX's login has a picture captcha, which on the real site a person has to read.
  # It isn't asked for a User ID the browser signed in with in the last 30 days. The
  # local ODeX puts the answer on its page, so these SOPs run unattended.
  - action: execute_script
    description: Read the captcha (the local ODeX gives its answer)
    method: playwright
    script: |
      () => {
        const box = document.querySelector('#valiIpt');
        if (!box || !box.checkVisibility()) return { set_params: { captcha: '' } };
        const answer = document.querySelector('#valicode')?.dataset.answer;
        if (!answer) throw new Error('The captcha has to be read by a person');
        return { set_params: { captcha: answer } };
      }

  - action: fill
    description: Enter the captcha
    method: playwright
    condition: params.captcha
    selector: "#valiIpt"
    value_from: params.captcha

  - action: click
    description: Sign in
    method: playwright
    selector: "#signIn"

  - action: wait_for_selector
    description: Wait for ODeX to ask for the company, or to say why not
    method: playwright
    selector: "xpath=//*[@id='confirmSignIn'] | //*[@id='epayment-location'] | //*[@id='invDivMsg'][normalize-space()]"

  - action: execute_script
    description: Make sure ODeX took the login
    method: playwright
    script: |
      () => {
        const said = document.querySelector('#invDivMsg')?.textContent.trim();
        if (said) throw new Error(`ODeX didn't sign in: ${said}`);
        return { set_params: { choose_company: Boolean(document.querySelector('#confirmSignIn')) } };
      }

  # After the password ODeX asks which of the login's companies to sign in as.
  - action: execute_script
    description: Choose the company
    method: playwright
    condition: params.choose_company
    script: |
      () => {
        const select = document.querySelector('#compName');
        const companies = [...select.options].filter((o) => o.value);
        if (companies.length !== 1) {
          throw new Error(`This ODeX login has ${companies.length} companies: the SOP has to be told which to sign in as`);
        }
        select.value = companies[0].value;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }

  # If the login is signed in somewhere else, ODeX asks in a dialog whether to close
  # that session. The agent accepts dialogs, which closes it.
  - action: click
    description: Confirm Sign In
    method: playwright
    condition: params.choose_company
    selector: "#confirmSignIn"

  - action: wait_for_selector
    description: Wait for the services page
    method: playwright
    selector: "#counter-go"

  - action: click
    description: Open Counter Process (Deposit and Refund)
    method: playwright
    selector: "#counter-go"

  - action: wait_for_selector
    description: Wait for the Deposit and Refund page
    method: playwright
    selector: "#new-deposit"

  - action: click
    description: New Deposit
    method: playwright
    selector: "#new-deposit"

  - action: wait_for_selector
    description: Wait for the deposit form
    method: playwright
    selector: "#deposit-form"

  # Who the refund goes to first: choosing Third Party shows the fields for it.
  - action: execute_script
    description: Choose the liner, the payment mode and who the refund goes to
    method: playwright
    script_args:
      liner: params.liner
      payment_mode: "RTGS/NEFT"
      refund_to: params.refund_to
    script: |
      ({ liner, payment_mode, refund_to }) => {
        const choose = (selector, wanted) => {
          const select = document.querySelector(selector);
          const option = [...select.options].find((o) => o.value === wanted || o.text.trim() === wanted);
          if (!option) throw new Error(`ODeX has no "${wanted}" in ${selector}`);
          select.value = option.value;
          select.dispatchEvent(new Event('change', { bubbles: true }));
        };
        choose('#liner', liner);
        choose('#paymentMode', payment_mode);
        choose('#refundTo', refund_to);
      }

  - action: fill
    description: Enter the house B/L number
    method: playwright
    selector: "#blNo"
    value_from: params.hbl_no

  - action: fill
    description: Enter the deposit amount
    method: playwright
    selector: "#amount"
    value_from: params.amount

  - action: fill
    description: Enter the UTR of the deposit payment
    method: playwright
    selector: "#utrNo"
    value_from: params.utr

  - action: fill
    description: Enter the payment date
    method: playwright
    selector: "#paymentDate"
    value_from: params.payment_date

  - action: fill
    description: Enter the paying bank
    method: playwright
    selector: "#bankName"
    value_from: params.bank_name

  - action: fill
    description: Enter the third party the refund goes to
    method: playwright
    condition: params.third_party_name
    selector: "#thirdPartyName"
    value_from: params.third_party_name

  - action: upload_file
    description: Attach the NOC for refunding a third party
    method: playwright
    condition: params.noc_file
    selector: "#nocFile"
    file_path_from: params.noc_file

  - action: upload_file
    description: Attach the security deposit receipt
    method: playwright
    selector: "#receiptFile"
    file_path_from: params.receipt_file

  # The submit and the check are separate steps: the agent retries a failed step,
  # and only the check is safe to repeat.
  - action: click
    description: Submit the deposit
    method: playwright
    selector: "#submit"

  - action: wait_for_selector
    description: Wait for ODeX's answer
    method: playwright
    selector: "#outcome"

  - action: execute_script
    description: Read the deposit reference ODeX gave
    method: playwright
    extract_result: true
    script: |
      () => {
        const outcome = document.querySelector('#outcome');
        if (outcome.dataset.status !== 'accepted') {
          throw new Error(`ODeX turned the deposit down: ${outcome.dataset.message}`);
        }
        return { odex_deposit_ref: outcome.dataset.reference };
      }

  - action: end
    description: Done
