# Check a security deposit on ODeX (Counter Process → Deposit and Refund) and,
# once CMA CGM has approved it, download its Security Deposit Acknowledgement Slip:
# the DO folder's Security-cum-ODEX Receipt. Runs once per house bill, and is safe
# to run again: it only reads.
#
# Written for the local ODeX (make portals). The real page's selectors aren't known
# yet; sops/local/README.md says what's needed to point it at the real one.
#
# Params, built by app/portal_params.py (step odex_deposit_status):
#   odex_url        where ODeX is: DO_ODEX_URL, the local one by default
#   hbl_no          the house B/L the deposit is for
#   slip_save_path  where to save the slip, with the job's files
#
# Reads back: deposit_ref, deposit_status, and downloaded_file_path once the slip is saved
metadata:
  name: "Local ODeX - Deposit status and slip"
  version: "0.1"

credentials:
  username_env: "LOCAL_ODEX_USERNAME"
  password_env: "LOCAL_ODEX_PASSWORD"

steps:
  - action: goto
    description: Open the ODeX login page
    method: playwright
    url: "{params.odex_url}/login"
    wait_for: domcontentloaded

  # The login page's fields have the real ODeX's ids.
  - action: fill
    description: Enter the User ID
    method: playwright
    selector: "#loginId"
    value_from: credentials.username_env

  - action: fill
    description: Enter the password
    method: playwright
    selector: "#password"
    value_from: credentials.password_env

  # ODeX's login has a picture captcha, which on the real site a person has to read.
  # It isn't asked for a User ID the browser signed in with in the last 30 days. The
  # local ODeX puts the answer on its page, so these SOPs run unattended.
  - action: execute_script
    description: Read the captcha (the local ODeX gives its answer)
    method: playwright
    script: |
      () => {
        const box = document.querySelector('#valiIpt');
        if (!box || !box.checkVisibility()) return { set_params: { captcha: '' } };
        const answer = document.querySelector('#valicode')?.dataset.answer;
        if (!answer) throw new Error('The captcha has to be read by a person');
        return { set_params: { captcha: answer } };
      }

  - action: fill
    description: Enter the captcha
    method: playwright
    condition: params.captcha
    selector: "#valiIpt"
    value_from: params.captcha

  - action: click
    description: Sign in
    method: playwright
    selector: "#signIn"

  - action: wait_for_selector
    description: Wait for ODeX to ask for the company, or to say why not
    method: playwright
    selector: "xpath=//*[@id='confirmSignIn'] | //*[@id='epayment-location'] | //*[@id='invDivMsg'][normalize-space()]"

  - action: execute_script
    description: Make sure ODeX took the login
    method: playwright
    script: |
      () => {
        const said = document.querySelector('#invDivMsg')?.textContent.trim();
        if (said) throw new Error(`ODeX didn't sign in: ${said}`);
        return { set_params: { choose_company: Boolean(document.querySelector('#confirmSignIn')) } };
      }

  # After the password ODeX asks which of the login's companies to sign in as.
  - action: execute_script
    description: Choose the company
    method: playwright
    condition: params.choose_company
    script: |
      () => {
        const select = document.querySelector('#compName');
        const companies = [...select.options].filter((o) => o.value);
        if (companies.length !== 1) {
          throw new Error(`This ODeX login has ${companies.length} companies: the SOP has to be told which to sign in as`);
        }
        select.value = companies[0].value;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }

  # If the login is signed in somewhere else, ODeX asks in a dialog whether to close
  # that session. The agent accepts dialogs, which closes it.
  - action: click
    description: Confirm Sign In
    method: playwright
    condition: params.choose_company
    selector: "#confirmSignIn"

  - action: wait_for_selector
    description: Wait for the services page
    method: playwright
    selector: "#counter-go"

  - action: click
    description: Open Counter Process (Deposit and Refund)
    method: playwright
    selector: "#counter-go"

  - action: wait_for_selector
    description: Wait for the list of deposits
    method: playwright
    selector: "#deposits"

  # The list is newest first, so the first row for the B/L is its latest deposit.
  # Marks the slip link for the download step, which takes a fixed selector.
  - action: execute_script
    description: Find this B/L's deposit and read its status
    method: playwright
    extract_result: true
    script_args:
      hbl_no: params.hbl_no
    script: |
      ({ hbl_no }) => {
        const row = [...document.querySelectorAll('#deposits tbody tr[data-bl]')].find((r) => r.dataset.bl === hbl_no);
        if (!row) throw new Error(`ODeX has no deposit for B/L ${hbl_no}`);
        const approved = row.dataset.status === 'Deposit Approved';
        if (approved) row.querySelector('a.download-slip').id = 'slip-to-download';
        return { deposit_ref: row.dataset.ref, deposit_status: row.dataset.status, set_params: { slip_ready: approved } };
      }

  - action: download_file
    description: Download the deposit slip, once the deposit is approved
    method: playwright
    condition: params.slip_ready
    selector: "#slip-to-download"
    save_path_from: params.slip_save_path

  - action: end
    description: Done
