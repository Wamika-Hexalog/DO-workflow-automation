# Raise the DO request on ODeX, as the team's guide "DO final steps corrected" does it,
# once the DO folder is ready: open ePayment for the MBL's place of delivery, then
# Documents → DO Request, close the advertisement, NEW DO REQUEST, fill in the BL
# information and add the DO folder through Add Row as "All document in a single
# pdf", then SAVE. Runs once per house bill, each time with the same folder PDF of
# the MBL: CMA CGM's note on the page says "If IGM has been filed for HBL, please
# submit a DO Request on ODeX for the respective HBL".
#
# Written for the local ODeX (make portals), whose pages are the guide's screenshots
# with live buttons and fields over them. With DO_ODEX_SOP pointing here, the app's
# do-request-submit workflow runs it when ops approve the DO request (make
# demo-local). The real ODeX's selectors aren't known: that needs its pages' HTML
# (sops/local/README.md).
#
# Params, built by app/portal_params.py (step odex_do_request_new):
#   odex_url           where ODeX is: DO_ODEX_URL, the local one by default
#   odex_location      job: ODeX location (the MBL's place of delivery; ICD Tughlakabad is NCR)
#   liner              fixed details: Liner on ODeX, which ODeX fills in from the BL
#   hbl_no             the house B/L this request is for
#   destuff_type       job: Delivery type, as ODeX's DE Stuffing Type (Factory)
#   seaway_bl          job: Endorsed: Yes for a waybill or telex release
#   runner_boy         fixed details: Runner boy (empty in the guide; skipped when empty)
#   runner_mobile      fixed details: Runner boy's mobile no. (likewise)
#   remarks            fixed details: Remarks on the DO request
#   hss_customer_name  fixed details: HSS customer name
#   factory_address    fixed details: Factory address
#   factory_pin        fixed details: Factory location PIN
#   folder_pdf_path    the built DO folder, as ALL <last 4 of the HBL>.pdf; it must be up to date
# Cargo Type is General every time (guide, step 4).
#
# Reads back: odex_request_ref (the app logs it on the job), odex_confirmation
metadata:
  name: "Local ODeX - New DO Request"
  version: "0.2"

credentials:
  username_env: "LOCAL_ODEX_USERNAME"
  password_env: "LOCAL_ODEX_PASSWORD"

steps:
  - action: goto
    description: Open the ODeX login page
    method: playwright
    url: "{params.odex_url}/login"
    wait_for: domcontentloaded

  # The login page's fields have the real ODeX's ids.
  - action: fill
    description: Enter the User ID
    method: playwright
    selector: "#loginId"
    value_from: credentials.username_env

  - action: fill
    description: Enter the password
    method: playwright
    selector: "#password"
    value_from: credentials.password_env

  # ODeX's login has a picture captcha, which on the real site a person has to read.
  # It isn't asked for a User ID the browser signed in with in the last 30 days. The
  # local ODeX puts the answer on its page, so these SOPs run unattended.
  - action: execute_script
    description: Read the captcha (the local ODeX gives its answer)
    method: playwright
    script: |
      () => {
        const box = document.querySelector('#valiIpt');
        if (!box || !box.checkVisibility()) return { set_params: { captcha: '' } };
        const answer = document.querySelector('#valicode')?.dataset.answer;
        if (!answer) throw new Error('The captcha has to be read by a person');
        return { set_params: { captcha: answer } };
      }

  - action: fill
    description: Enter the captcha
    method: playwright
    condition: params.captcha
    selector: "#valiIpt"
    value_from: params.captcha

  - action: click
    description: Sign in
    method: playwright
    selector: "#signIn"

  - action: wait_for_selector
    description: Wait for ODeX to ask for the company, or to say why not
    method: playwright
    selector: "xpath=//*[@id='confirmSignIn'] | //*[@id='epayment-location'] | //*[@id='invDivMsg'][normalize-space()]"

  - action: execute_script
    description: Make sure ODeX took the login
    method: playwright
    script: |
      () => {
        const said = document.querySelector('#invDivMsg')?.textContent.trim();
        if (said) throw new Error(`ODeX didn't sign in: ${said}`);
        return { set_params: { choose_company: Boolean(document.querySelector('#confirmSignIn')) } };
      }

  # After the password ODeX asks which of the login's companies to sign in as.
  - action: execute_script
    description: Choose the company
    method: playwright
    condition: params.choose_company
    script: |
      () => {
        const select = document.querySelector('#compName');
        const companies = [...select.options].filter((o) => o.value);
        if (companies.length !== 1) {
          throw new Error(`This ODeX login has ${companies.length} companies: the SOP has to be told which to sign in as`);
        }
        select.value = companies[0].value;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }

  # If the login is signed in somewhere else, ODeX asks in a dialog whether to close
  # that session. The agent accepts dialogs, which closes it.
  - action: click
    description: Confirm Sign In
    method: playwright
    condition: params.choose_company
    selector: "#confirmSignIn"

  # Guide, step 1: the services page; ePayment for the MBL's place of delivery.
  - action: wait_for_selector
    description: Wait for the services page
    method: playwright
    selector: "#epayment-location"

  - action: execute_script
    description: Choose ePayment's location
    method: playwright
    script_args:
      location: params.odex_location
    script: |
      ({ location }) => {
        const select = document.querySelector('#epayment-location');
        const option = [...select.options].find((o) => o.value === location || o.text.trim() === location);
        if (!option) throw new Error(`ODeX has no location "${location}"`);
        select.value = option.value;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }

  - action: click
    description: Open ePayment
    method: playwright
    selector: "#epayment-go"

  # Guide, step 2: Documents → DO Request.
  - action: wait_for_selector
    description: Wait for ePayment's main page
    method: playwright
    selector: "#edo-search"

  - action: click
    description: Open the Documents menu
    method: playwright
    selector: "#menu-documents"

  - action: click
    description: Go to DO Request
    method: playwright
    selector: "#menu-do-request"

  # Guide, step 3: close the advertisement, then NEW DO REQUEST.
  - action: wait_for_selector
    description: Wait for the list of DO requests
    method: playwright
    selector: "#new-do-request"

  - action: execute_script
    description: Close the advertisement, if there is one
    method: playwright
    script: |
      () => {
        const close = document.querySelector('#ad-close');
        if (close && close.checkVisibility()) close.click();
      }

  - action: click
    description: NEW DO REQUEST
    method: playwright
    selector: "#new-do-request"

  # Guide, step 4: the BL information.
  - action: wait_for_selector
    description: Wait for the DO request
    method: playwright
    selector: "#bl-no"

  - action: fill
    description: Enter the BL No. (the house B/L)
    method: playwright
    selector: "#bl-no"
    value_from: params.hbl_no

  # Leaving the field makes ODeX fill in the Liner/FF-Issuer from the BL.
  - action: press
    description: Leave the BL No.
    method: playwright
    selector: "#bl-no"
    key: Tab

  - action: wait_for_selector
    description: Wait for ODeX to fill in the Liner/FF-Issuer
    method: playwright
    selector: "#liner-issuer:not([value=''])"

  - action: execute_script
    description: Check the liner, then choose the location, cargo type, DE stuffing type and Seaway BL/Telex BL
    method: playwright
    script_args:
      liner: params.liner
      location: params.odex_location
      cargo_type: "General"
      destuff_type: params.destuff_type
      seaway_bl: params.seaway_bl
    script: |
      ({ liner, location, cargo_type, destuff_type, seaway_bl }) => {
        // ODeX's liner names are long ("CMA CGM AGENCIES INDIA PRIVATE LIMITED"): one
        // that starts with the name given is the one.
        const issuer = document.querySelector('#liner-issuer').value.trim();
        if (!issuer.toUpperCase().startsWith(String(liner).trim().toUpperCase())) {
          throw new Error(`ODeX says this BL is ${issuer}'s, not ${liner}'s`);
        }
        const choose = (selector, wanted) => {
          const select = document.querySelector(selector);
          const want = String(wanted).trim().toUpperCase();
          const option = [...select.options].find((o) => o.value && (o.value.toUpperCase() === want || o.text.trim().toUpperCase() === want));
          if (!option) throw new Error(`ODeX has no "${wanted}" in ${selector}`);
          select.value = option.value;
          select.dispatchEvent(new Event('change', { bubbles: true }));
        };
        choose('#location', location);
        choose('#cargo-type', cargo_type);
        choose('#destuff-type', destuff_type);
        choose('#seaway-bl', seaway_bl);
      }

  - action: execute_script
    description: Tick Payment not via ODeX (Finance pays CMA CGM by RTGS)
    method: playwright
    script: |
      () => {
        const box = document.querySelector('#payment-not-via-odex');
        if (!box.checked) box.click();
        if (!box.checked) throw new Error("Payment not via ODeX didn't tick");
      }

  - action: fill
    description: Enter the runner boy
    method: playwright
    condition: params.runner_boy
    selector: "#runner-boy"
    value_from: params.runner_boy

  - action: fill
    description: Enter the runner boy's mobile no.
    method: playwright
    condition: params.runner_mobile
    selector: "#mobile-no"
    value_from: params.runner_mobile

  - action: fill
    description: Enter the remarks
    method: playwright
    selector: "#remarks"
    value_from: params.remarks

  - action: fill
    description: Enter the HSS customer name
    method: playwright
    selector: "#hss-customer-name"
    value_from: params.hss_customer_name

  - action: fill
    description: Enter the factory address
    method: playwright
    selector: "#factory-address"
    value_from: params.factory_address

  - action: fill
    description: Enter the factory location PIN
    method: playwright
    selector: "#factory-pin"
    value_from: params.factory_pin

  # Guide, step 5: Add Row, the DO folder in it, and SAVE.
  - action: click
    description: Add Row
    method: playwright
    selector: "#add-row"

  - action: wait_for_selector
    description: Wait for the new row
    method: playwright
    selector: "#document-rows tr[data-row='1']"

  - action: execute_script
    description: Name the row's document
    method: playwright
    script_args:
      doc_name: "All document in a single pdf"
    script: |
      ({ doc_name }) => {
        const select = document.querySelector("#document-rows tr[data-row='1'] select.doc-name");
        const option = [...select.options].find((o) => o.value === doc_name || o.text.trim() === doc_name);
        if (!option) throw new Error(`ODeX has no document "${doc_name}"`);
        select.value = option.value;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }

  - action: upload_file
    description: Attach the DO folder
    method: playwright
    selector: "#document-rows tr[data-row='1'] input.doc-file"
    file_path_from: params.folder_pdf_path

  # The submit and the check are separate steps: the agent retries a failed step,
  # and only the check is safe to repeat.
  - action: click
    description: SAVE
    method: playwright
    selector: "#save"

  - action: wait_for_selector
    description: Wait for ODeX's answer
    method: playwright
    selector: "#outcome"

  - action: execute_script
    description: Read the request number ODeX gave
    method: playwright
    extract_result: true
    script: |
      () => {
        const outcome = document.querySelector('#outcome');
        if (outcome.dataset.status !== 'accepted') {
          throw new Error(`ODeX turned the DO request down: ${outcome.dataset.message}`);
        }
        return { odex_request_ref: outcome.dataset.reference, odex_confirmation: outcome.dataset.message };
      }

  - action: end
    description: Done
