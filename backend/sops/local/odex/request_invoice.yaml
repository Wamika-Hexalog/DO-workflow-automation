# Request the DO invoice on ODeX, as the team's guide "Delivery Order Request-First
# step 1" does it (steps 1-5): open ePayment for the MBL's place of delivery, then
# Requests → Liner Requests → Request New Invoice, enter the BL and attach the MBL as
# the Seaway BL. The first step of the DO process, once CMA CGM has filed the IGM.
# Runs once per MBL.
#
# Written for the local ODeX (make portals), whose pages are the guide's screenshots
# with live buttons and fields over them. The real ODeX's selectors aren't known:
# that needs its pages' HTML (sops/local/README.md).
#
# Params, built by app/portal_params.py (step odex_request_invoice):
#   odex_url        where ODeX is: DO_ODEX_URL, the local one by default
#   odex_location   job: ODeX location (the MBL's place of delivery; ICD Tughlakabad is NCR)
#   liner           fixed details: Liner on ODeX
#   mbl_no          job: Master B/L no.
#   delivery_type   job: Delivery type, in ODeX's words (Factory Destuff)
#   job_no          the job number
#   mbl_file        the MBL from the DO folder, as MBL-<MBL no.>.pdf
# "Invoice In Name of" is ODeX's own and the same every time (guide, step 5).
#
# Reads back: odex_invoice_request_ref
metadata:
  name: "Local ODeX - Request New Invoice"
  version: "0.2"

credentials:
  username_env: "LOCAL_ODEX_USERNAME"
  password_env: "LOCAL_ODEX_PASSWORD"

steps:
  - action: goto
    description: Open the ODeX login page
    method: playwright
    url: "{params.odex_url}/login"
    wait_for: domcontentloaded

  # The login page's fields have the real ODeX's ids.
  - action: fill
    description: Enter the User ID
    method: playwright
    selector: "#loginId"
    value_from: credentials.username_env

  - action: fill
    description: Enter the password
    method: playwright
    selector: "#password"
    value_from: credentials.password_env

  # ODeX's login has a picture captcha, which on the real site a person has to read.
  # It isn't asked for a User ID the browser signed in with in the last 30 days. The
  # local ODeX puts the answer on its page, so these SOPs run unattended.
  - action: execute_script
    description: Read the captcha (the local ODeX gives its answer)
    method: playwright
    script: |
      () => {
        const box = document.querySelector('#valiIpt');
        if (!box || !box.checkVisibility()) return { set_params: { captcha: '' } };
        const answer = document.querySelector('#valicode')?.dataset.answer;
        if (!answer) throw new Error('The captcha has to be read by a person');
        return { set_params: { captcha: answer } };
      }

  - action: fill
    description: Enter the captcha
    method: playwright
    condition: params.captcha
    selector: "#valiIpt"
    value_from: params.captcha

  - action: click
    description: Sign in
    method: playwright
    selector: "#signIn"

  - action: wait_for_selector
    description: Wait for ODeX to ask for the company, or to say why not
    method: playwright
    selector: "xpath=//*[@id='confirmSignIn'] | //*[@id='epayment-location'] | //*[@id='invDivMsg'][normalize-space()]"

  - action: execute_script
    description: Make sure ODeX took the login
    method: playwright
    script: |
      () => {
        const said = document.querySelector('#invDivMsg')?.textContent.trim();
        if (said) throw new Error(`ODeX didn't sign in: ${said}`);
        return { set_params: { choose_company: Boolean(document.querySelector('#confirmSignIn')) } };
      }

  # After the password ODeX asks which of the login's companies to sign in as.
  - action: execute_script
    description: Choose the company
    method: playwright
    condition: params.choose_company
    script: |
      () => {
        const select = document.querySelector('#compName');
        const companies = [...select.options].filter((o) => o.value);
        if (companies.length !== 1) {
          throw new Error(`This ODeX login has ${companies.length} companies: the SOP has to be told which to sign in as`);
        }
        select.value = companies[0].value;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }

  # If the login is signed in somewhere else, ODeX asks in a dialog whether to close
  # that session. The agent accepts dialogs, which closes it.
  - action: click
    description: Confirm Sign In
    method: playwright
    condition: params.choose_company
    selector: "#confirmSignIn"

  # Guide, steps 1-2: the services page; ePayment for the MBL's place of delivery.
  - action: wait_for_selector
    description: Wait for the services page
    method: playwright
    selector: "#epayment-location"

  - action: execute_script
    description: Choose ePayment's location
    method: playwright
    script_args:
      location: params.odex_location
    script: |
      ({ location }) => {
        const select = document.querySelector('#epayment-location');
        const option = [...select.options].find((o) => o.value === location || o.text.trim() === location);
        if (!option) throw new Error(`ODeX has no location "${location}"`);
        select.value = option.value;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }

  - action: click
    description: Open ePayment
    method: playwright
    selector: "#epayment-go"

  # Guide, steps 3-4: Requests → Liner Requests → Request New Invoice.
  - action: wait_for_selector
    description: Wait for ePayment's main page
    method: playwright
    selector: "#edo-search"

  - action: click
    description: Open the Requests menu
    method: playwright
    selector: "#menu-requests"

  - action: click
    description: Go to Liner Requests
    method: playwright
    selector: "#menu-liner-requests"

  - action: wait_for_selector
    description: Wait for the list of invoice requests
    method: playwright
    selector: "#request-new-invoice"

  - action: click
    description: Request New Invoice
    method: playwright
    selector: "#request-new-invoice"

  # Guide, step 5: the BL information and its required document.
  - action: wait_for_selector
    description: Wait for the new invoice request
    method: playwright
    selector: "#bl-no"

  - action: execute_script
    description: Choose the liner, BL location, type, type of delivery and attachment type
    method: playwright
    script_args:
      liner: params.liner
      location: params.odex_location
      bl_type: "Import"
      delivery: params.delivery_type
      attachment: "Seaway BL"
    script: |
      ({ liner, location, bl_type, delivery, attachment }) => {
        // ODeX's liner names are long ("CMA CGM AGENCIES INDIA PRIVATE LIMITED"): one
        // that starts with the name given is taken.
        const choose = (selector, wanted) => {
          const select = document.querySelector(selector);
          const want = String(wanted).trim().toUpperCase();
          const options = [...select.options].filter((o) => o.value);
          const option = options.find((o) => o.value.toUpperCase() === want || o.text.trim().toUpperCase() === want)
            || options.find((o) => o.text.trim().toUpperCase().startsWith(want));
          if (!option) throw new Error(`ODeX has no "${wanted}" in ${selector}`);
          select.value = option.value;
          select.dispatchEvent(new Event('change', { bubbles: true }));
        };
        choose('#liner-name', liner);
        choose('#bl-location', location);
        choose('#bl-type', bl_type);
        choose('#delivery-type', delivery);
        choose('#attachment-type-1', attachment);
      }

  - action: fill
    description: Enter the BL no. (the master B/L)
    method: playwright
    selector: "#bl-no"
    value_from: params.mbl_no

  - action: fill
    description: Enter the job number
    method: playwright
    selector: "#job-no"
    value_from: params.job_no

  - action: upload_file
    description: Attach the MBL as the Seaway BL
    method: playwright
    selector: "#attachment-file-1"
    file_path_from: params.mbl_file

  - action: fill
    description: Ask for the tax invoice in the attachment's remarks
    method: playwright
    selector: "#attachment-remarks-1"
    value: "PLEASE RELEASE TAX INVOICE"

  # The submit and the check are separate steps: the agent retries a failed step,
  # and only the check is safe to repeat.
  - action: click
    description: Submit the invoice request
    method: playwright
    selector: "#submit-invoice-request"

  - action: wait_for_selector
    description: Wait for ODeX's answer
    method: playwright
    selector: "#outcome"

  - action: execute_script
    description: Read the request number ODeX gave
    method: playwright
    extract_result: true
    script: |
      () => {
        const outcome = document.querySelector('#outcome');
        if (outcome.dataset.status !== 'accepted') {
          throw new Error(`ODeX turned the invoice request down: ${outcome.dataset.message}`);
        }
        return { odex_invoice_request_ref: outcome.dataset.reference };
      }

  - action: end
    description: Done
