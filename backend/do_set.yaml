# The DO set: what the customs team fills in for each shipment, and what the
# Word template receives. Every key is also the placeholder name in
# templates/do_set.docx, for example {{ bl_no }}.
#
# Pages and fields below are placeholders until the real DO set arrives.
# The UI is built from this file, so editing it is all a field change needs.
#
# Field types: text, textarea, date, number, select (needs options),
# checkbox, containers (ISO 6346 numbers, one per line).
# code: true shows the value in capitals, for references like BL numbers.

date_format: "%d/%m/%Y"   # how dates appear in the generated document

# The same for every shipment of the client. Set once in the client profile.
client_fields:
  - { key: importer_name, label: Importer name }
  - { key: importer_address, label: Importer address, type: textarea }
  - { key: iec, label: IEC, code: true }
  - { key: gstin, label: GSTIN, code: true }
  - { key: signatory_name, label: Authorised signatory }
  - { key: signatory_designation, label: Signatory designation }
  - { key: cha_name, label: Customs broker }
  - { key: cha_licence, label: Broker licence no., code: true }

# Entered once per shipment and reused by every page that lists them under `uses`.
shipment_groups:
  - title: Bill of lading
    fields:
      - { key: bl_no, label: BL number, code: true }
      - { key: bl_date, label: BL date, type: date }
      - key: shipping_line
        label: Shipping line
        type: select
        options: [MSC, Maersk, CMA CGM, Hapag-Lloyd, ONE, COSCO, Evergreen]
      - { key: pol, label: Port of loading }

  - title: Vessel and IGM
    fields:
      - { key: vessel, label: Vessel }
      - { key: voyage, label: Voyage, code: true }
      - { key: eta, label: ETA, type: date }
      - key: pod
        label: Port of discharge
        type: select
        options: ["Nhava Sheva (INNSA1)", "Mundra (INMUN1)", "Chennai (INMAA1)"]
      - key: delivery_place
        label: Place of delivery
        type: select
        options: [ICD Tughlakabad, ICD Garhi Harsaru, ICD Patparganj, CFS at port]
      - { key: igm_no, label: IGM number, code: true }
      - { key: igm_date, label: IGM date, type: date }
      - { key: igm_line, label: IGM line no., code: true }

  - title: Containers and cargo
    fields:
      - { key: containers, label: Container numbers, type: containers, code: true }
      - { key: container_size, label: Container size, type: select, options: [20GP, 40GP, 40HC] }
      - { key: packages, label: Packages }
      - { key: gross_weight, label: Gross weight (kg), type: number }
      - { key: cargo_desc, label: Cargo description }

# One entry per page of the DO set, in order. `uses` lists the client and
# shipment fields the page prints; `fields` are asked for on that page only.
pages:
  - id: p01
    title: DO request letter
    uses: [importer_name, cha_name, bl_no, bl_date, shipping_line, vessel, voyage, igm_no, igm_date, igm_line, containers, packages, gross_weight, cargo_desc, delivery_place]
    fields:
      - { key: p01_date, label: Letter date, type: date }
      - { key: p01_ref, label: Our reference, code: true }

  - id: p02
    title: Authority letter
    uses: [importer_name, importer_address, iec, signatory_name, signatory_designation, cha_name, cha_licence, bl_no]
    fields:
      - { key: p02_person, label: Person collecting the DO }
      - { key: p02_valid, label: Authority valid until, type: date }

  - id: p03
    title: Letter of indemnity
    uses: [importer_name, importer_address, signatory_name, shipping_line, bl_no, bl_date, vessel, voyage]
    fields:
      - { key: p03_reason, label: Reason for indemnity, type: select, options: [Original BL not yet received, Telex release, Seaway bill] }
      - { key: p03_stamp, label: Stamp paper value (₹), type: number }

  - id: p04
    title: Container return undertaking
    uses: [importer_name, shipping_line, containers, container_size, delivery_place]
    fields:
      - { key: p04_yard, label: Empty return yard }
      - { key: p04_free, label: Free days agreed, type: number }

  - id: p05
    title: Detention and damage undertaking
    uses: [importer_name, signatory_name, shipping_line, containers]
    fields:
      - { key: p05_accept, label: Importer accepts detention and damage liability, type: checkbox }

  - id: p06
    title: Container security deposit
    uses: [importer_name, shipping_line, containers, container_size]
    fields:
      - { key: p06_mode, label: Deposit mode, type: select, options: [Bank transfer, Cheque, "Waived, bond on file"] }
      - { key: p06_amount, label: Deposit amount (₹), type: number }

  - id: p07
    title: KYC declaration
    uses: [importer_name, importer_address, iec, gstin, signatory_name]
    fields:
      - { key: p07_date, label: Declaration date, type: date }

  - id: p08
    title: BL surrender confirmation
    uses: [bl_no, bl_date, shipping_line, pol]
    fields:
      - { key: p08_release, label: Release type, type: select, options: [Original BL, Telex release, Seaway bill] }
      - { key: p08_ref, label: Surrender reference, code: true }

  - id: p09
    title: CFS nomination letter
    uses: [importer_name, bl_no, igm_no, igm_line, pod, delivery_place]
    fields:
      - { key: p09_cfs, label: Nominated CFS }
      - { key: p09_mode, label: Onward movement, type: select, options: [Rail, Road] }

  - id: p10
    title: Free time request
    uses: [importer_name, shipping_line, bl_no, containers]
    fields:
      - { key: p10_days, label: Free days requested, type: number }
      - { key: p10_reason, label: Reason, type: textarea }

  - id: p11
    title: Local charges payment
    uses: [shipping_line, bl_no]
    fields:
      - { key: p11_utr, label: UTR or payment reference, code: true }
      - { key: p11_amount, label: Amount paid (₹), type: number }
      - { key: p11_date, label: Payment date, type: date }

  - id: p12
    title: High seas sale declaration
    uses: [importer_name, bl_no]
    fields:
      - { key: p12_hss, label: High seas sale, type: select, options: [Not applicable, Applicable] }

  - id: p13
    title: DO validity request
    uses: [bl_no, eta, delivery_place]
    fields:
      - { key: p13_till, label: Validity needed until, type: date }

  - id: p14
    title: Particulars declaration
    uses: [importer_name, signatory_name, signatory_designation, bl_no, packages, gross_weight, cargo_desc]
    fields:
      - { key: p14_place, label: Place of signing }
      - { key: p14_date, label: Date of signing, type: date }
