[project]
name = "do-workflow-automation"
version = "0.1.0"
description = "Workflow automation for DO."
readme = "README.md"
authors = [
    { name = "Wamika Singh", email = "wamika@hexalog.in" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]



[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing"
