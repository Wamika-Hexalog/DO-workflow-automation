# The DO folder: the documents CMA CGM needs for a delivery order, in the order
# they go into the combined PDF, and the fields the generated letters print.
# Source: "DO PROCESS FLOW E2E.xlsx", sheet "DO Folder Document Collection".
# It also holds the fields the portals are filled with (ODeX, CMA RTGS): see
# app/portal_params.py for which page uses which.
#
# The UI is built from this file. If it has a mistake, the API refuses to start
# and says what it is.
#
# Field types: text, textarea, date, number, select (needs options), checkbox,
# containers (ISO 6346 numbers, one per line), list (one value per line).
# code: true shows the value in capitals, for references like BL numbers.
# optional: true means a blank value doesn't hold up the folder.
# default: the value a new shipment starts with. "today" works for dates.

date_format: "%d/%m/%Y"   # how dates are printed in the generated letters

# The same for every shipment. Set once in the fixed details.
profile_fields:
  - { key: forwarder_name, label: Forwarder, default: HEXALOG GLOBAL SUPPLY CHAINS PVT LTD }
  - { key: forwarder_signatory, label: Forwarder signatory, default: VINEET MALIK }
  - { key: forwarder_designation, label: Signatory designation, default: DIRECTOR }
  - { key: forwarder_pan, label: Forwarder PAN, code: true, default: ABJCS8010P }
  - { key: forwarder_tel, label: Consignee phone on the checklist, default: "8802757004" }
  - { key: forwarder_email, label: Consignee email on the checklist, default: KISHAN@HEXALOG.IN }
  - { key: cha_email, label: CHA email on the checklist, default: customs-ops@Hexalog.in }
  - { key: do_collector, label: Person collecting the DO, default: MR. MUKESH KUMAR }
  - { key: line_agent, label: Shipping line agent, default: CMA CGM AGENCIES INDIA PVT LTD }
  - key: line_agent_address
    label: Line agent address
    type: textarea
    default: "A-32, Genesis Building, Ground floor, Mohan Coop Industrial Estate, Mathura Road, New Delhi – 110044"
  - { key: odex_liner, label: Liner on ODeX, default: CMA CGM }
  - { key: payer_bank, label: Bank that pays CMA CGM, default: ICICI BANK }
  # Who confirms payments on CMA CGM's RTGS page, and where its receipts and the
  # DO invoice are emailed (at most 3, comma-separated). The Graph subscription
  # reads them from there.
  - { key: rtgs_contact_name, label: Contact name on CMA CGM's RTGS page, default: Kishan Rawat }
  - { key: rtgs_contact_number, label: Contact number on CMA CGM's RTGS page, default: "8802757004" }
  - { key: do_mailbox, label: Emails for CMA CGM's invoice and receipts, default: "kishan@hexalog.in,customs-ops@Hexalog.in" }
  # Kept out of this file: entered once in the fixed details. Only the RTGS page needs it.
  - { key: payer_account_no, label: Bank account no. that pays CMA CGM, code: true, optional: true }
  # Where the app mails the DO invoice for payment (DO_AUTOMATE_PORTALS). Finance replies with the UTRs.
  - { key: finance_email, label: Finance's email for the DO invoice, default: kishan@hexalog.in }
  # The DO request on ODeX, as the team's guide "DO final steps corrected" fills it.
  # Its screenshots leave the runner boy and his mobile no. empty.
  - { key: odex_hss_customer, label: HSS customer name on ODeX's DO request, default: HEXALOG GLOBAL SUPPLY CHAINS PVT LTD }
  - key: factory_address
    label: Factory address on ODeX's DO request
    type: textarea
    default: "PLOT NOS. 92-93, AIHP MILLENIUM UDYOG VIHAR, PHASE-4"
  - { key: factory_pin, label: Factory location PIN on ODeX's DO request, code: true, default: "122015" }
  - { key: odex_do_remarks, label: Remarks on ODeX's DO request, default: Forwarder Letter attached to authorise CHA }
  - { key: odex_runner_boy, label: Runner boy on ODeX's DO request, optional: true }
  - { key: odex_runner_mobile, label: Runner boy's mobile no. on ODeX's DO request, code: true, optional: true }

# Entered once per shipment (one MBL) and printed by the letters that use them.
shipment_groups:
  - title: Bill of lading
    fields:
      - { key: mbl_no, label: Master B/L no., code: true }
      - { key: hbl_nos, label: House B/L nos., type: list, code: true }
      - { key: containers, label: Container nos., type: containers, code: true }
      - { key: vessel, label: Vessel name }
      - { key: voyage, label: Voyage, code: true }
      # Where ODeX's services are opened: the MBL's final place of delivery (the
      # team's ODeX guide, step 1). ICD Tughlakabad is NCR.
      - key: odex_location
        label: ODeX location (MBL's place of delivery)
        type: select
        options: [NCR, Mundra, Nhava Sheva, Ahmedabad, ICD Baroda, ICD VAPI (VALVADA), Kakinada, Kandla, Kattupalli, Paradip, Chennai, Kolkata]
        default: NCR

  - title: Parties
    fields:
      - { key: consignee_mbl, label: Consignee as per MBL, default: HEXALOG GLOBAL SUPPLY CHAINS PVT LTD }
      - { key: consignee_hbl, label: Consignee as per HBL, default: ENVOGUE STYLES GLOBAL LLP }
      - { key: cha, label: CHA, default: JAY SHRI RAM DARBAR LOGISTICS (P) LTD }

  - title: Letters
    fields:
      - { key: letter_date, label: Date on the letters, type: date, default: today }

  - title: CMA CGM checklist
    fields:
      - { key: endorsed, label: Endorsed, type: select, options: [OBL, Waybill, TELEX Release], default: TELEX Release }
      - { key: delivery_type, label: Delivery type, type: select, options: [Factory De-stuff, CFS De-stuff, LCL, DPD], default: Factory De-stuff }
      - { key: loi_for, label: LOI for factory delivery, type: select, options: [MBL Consignee, HBL Consignee], default: MBL Consignee }
      - { key: factory_location, label: Factory location, optional: true }
      - { key: validity_required, label: Date of validity required, type: date, optional: true }
      - { key: noc_from_forwarder, label: NOC from forwarder for HBL shipments, type: checkbox, optional: true, default: true }
      - { key: hss, label: High seas sale, type: checkbox, optional: true }
      - { key: hss_documents, label: HSS documents and LOI, type: checkbox, optional: true }
      - { key: payment_mode, label: Mode of payment, type: select, options: [Online Payment, DD/PAYORDER, CHEQUE], default: Online Payment }
      - { key: do_type, label: D/O or E-DO, type: select, options: [D/O, E-DO], default: E-DO }

  # Filled as the process goes: today by hand, later from CMA CGM's and Finance's
  # emails by the Graph ingest.
  - title: Liner invoice
    fields:
      - { key: do_invoice_no, label: DO invoice no., code: true, optional: true }
      - { key: do_invoice_amount, label: DO invoice amount (₹), type: number, optional: true }

  - title: Payment and deposit
    fields:
      - { key: deposit_amount, label: Security deposit (₹), type: number, optional: true, default: "40000" }
      - { key: payment_utr, label: UTR for the shipment payment, code: true, optional: true }
      - { key: deposit_utr, label: UTR for the security deposit, code: true, optional: true }
      - { key: payment_date, label: Date of transfer, type: date, optional: true }
      - key: deposit_refund_to
        label: Deposit refunded to
        type: select
        options: [Third Party, Consignee]
        default: Third Party
        optional: true

# Stamp artwork, in assets/private/stamps/ (run scripts/prepare_assets.py).
stamps:
  hexalog: { file: hexalog.png, name: Hexalog Global }
  jai_shri: { file: jai_shri.png, name: Jai Shri Ram Darbar }
  envogue: { file: envogue.png, name: Envogue Styles }

# The DO folder, in PDF order.
#   source: fixed (the same file every time), upload (arrives by email) or
#           generate (the app writes it from the fields).
#   per_hbl: one copy for every house B/L of the shipment.
#   match: identifiers that must appear in an uploaded file's text, so a file
#          from another shipment is caught. hbl means the copy's own HBL.
#   stamp: for uploads, where it goes, as fractions of the page: x and y of
#          the stamp's centre from the bottom-left corner, and its width.
#          Generated letters place their own stamp at the signature.
documents:
  - key: bond_consignee
    title: Bond (Consignee)
    source: fixed
    file: bonds.pdf
    pages: [2]

  - key: bond_client
    title: Bond (Client)
    source: fixed
    file: bonds.pdf
    pages: [1]

  - key: hbl
    title: HBL (House Bill of Lading)
    source: upload
    per_hbl: true
    match: [hbl]
    stamp: { stamp: envogue, pages: first, x: 0.19, y: 0.24, width: 0.22 }

  - key: mbl
    title: MBL (Master Bill of Lading)
    source: upload
    match: [mbl_no]
    stamp: { stamp: hexalog, pages: all, x: 0.62, y: 0.43, width: 0.16 }

  - key: security_receipt
    title: Security Receipt
    source: upload
    match: [mbl_no]

  - key: security_odex_receipt
    title: Security-cum-ODEX Receipt
    source: upload
    per_hbl: true
    match: [hbl]

  - key: do_receipt
    title: DO Receipt
    source: upload
    match: [mbl_no]

  - key: noc_cha
    title: NOC for DO (CHA)
    source: generate
    stamp: { stamp: jai_shri }
    uses: [letter_date, line_agent, line_agent_address, mbl_no, containers, hbl_nos, vessel, voyage, consignee_mbl, consignee_hbl, cha]

  - key: endorsed_do
    title: Endorsed Delivery Order
    source: generate
    stamp: { stamp: jai_shri }
    uses: [letter_date, line_agent, line_agent_address, do_collector, consignee_hbl, mbl_no, containers]

  - key: noc_hexalog
    title: NOC for DO (Hexalog)
    source: generate
    stamp: { stamp: hexalog }
    uses: [letter_date, line_agent, line_agent_address, mbl_no, containers, hbl_nos, vessel, voyage, consignee_mbl, consignee_hbl, forwarder_name, forwarder_signatory, forwarder_designation]

  - key: authorization
    title: Authorization Letter
    source: generate
    stamp: { stamp: hexalog }
    uses: [letter_date, line_agent, line_agent_address, mbl_no, containers, hbl_nos, vessel, voyage, consignee_mbl, consignee_hbl, cha, forwarder_name, forwarder_signatory, forwarder_designation]

  - key: checklist
    title: Checklist
    source: generate
    uses: [letter_date, consignee_mbl, forwarder_tel, forwarder_email, cha, cha_email, mbl_no, hbl_nos, endorsed, delivery_type, loi_for, factory_location, validity_required, noc_from_forwarder, hss, hss_documents, payment_mode, do_type]
